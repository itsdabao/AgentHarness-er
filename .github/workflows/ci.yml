name: checks

on:
  push:
  pull_request:

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

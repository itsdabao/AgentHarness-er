[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "minder-agent-harness"
version = "0.1.0"
description = "A small, bounded agent runtime for the Celesnity AI Track."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21,<1",
    "anyio>=4.5,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "jsonschema>=4.23,<5",
    "mcp>=2,<3",
]

[project.scripts]
minder-mock-mcp = "minder_mock_mcp.server:main"
minder-rpc = "minder_harness.app:main"
minder-cli = "minder_harness.cli:main"

[tool.setuptools.package-data]
minder_harness = ["web/*.html", "web/*.css", "web/*.js"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
